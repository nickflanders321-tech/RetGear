<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#2b3a4a"/>
      <stop offset="0.6" stop-color="#16202b"/>
      <stop offset="1" stop-color="#0b1016"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe7a6"/>
      <stop offset="0.45" stop-color="#e2bf6c"/>
      <stop offset="1" stop-color="#9c7a34"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d98f"/>
      <stop offset="0.5" stop-color="#a8843c"/>
      <stop offset="1" stop-color="#e9cc7d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="disc"><circle cx="256" cy="256" r="226"/></clipPath>
  </defs>

  <!-- medallion -->
  <circle cx="256" cy="256" r="248" fill="#0b0f14"/>
  <circle cx="256" cy="256" r="240" fill="url(#rim)"/>
  <circle cx="256" cy="256" r="228" fill="#1a1308"/>
  <circle cx="256" cy="256" r="226" fill="url(#bg)"/>

  <g clip-path="url(#disc)">
    <!-- faint contour lines, like an old map -->
    <g fill="none" stroke="#5d7488" stroke-opacity="0.18" stroke-width="3">
      <path d="M20 150 C 120 110, 200 190, 300 150 S 470 120, 520 160"/>
      <path d="M-10 230 C 90 200, 190 270, 300 235 S 460 210, 530 250"/>
      <path d="M-10 330 C 100 300, 210 370, 320 335 S 470 310, 530 350"/>
      <path d="M-10 420 C 110 395, 220 455, 330 425 S 480 400, 530 440"/>
    </g>
    <!-- the winding trail -->
    <path d="M92 452 C 110 392, 236 430, 232 368 C 228 316, 128 334, 140 282 C 152 236, 250 262, 300 304"
          fill="none" stroke="#0b1016" stroke-opacity="0.6" stroke-width="34" stroke-linecap="round"/>
    <path d="M92 452 C 110 392, 236 430, 232 368 C 228 316, 128 334, 140 282 C 152 236, 250 262, 300 304"
          fill="none" stroke="url(#gold)" stroke-width="18" stroke-linecap="round" stroke-dasharray="1 32"/>
  </g>

  <!-- glow behind the pin -->
  <circle cx="318" cy="170" r="150" fill="url(#glow)"/>

  <!-- waypoint pin -->
  <g transform="translate(318 178) scale(1.3)">
    <path d="M0 96 C -18 62, -66 30, -66 -18 A 66 66 0 1 1 66 -18 C 66 30, 18 62, 0 96 Z" fill="#0b0f14" transform="translate(5 7)" opacity="0.55"/>
    <path d="M0 96 C -18 62, -66 30, -66 -18 A 66 66 0 1 1 66 -18 C 66 30, 18 62, 0 96 Z" fill="url(#gold)" stroke="#5a4114" stroke-width="5"/>
    <circle cx="0" cy="-18" r="34" fill="#1a2532" stroke="#5a4114" stroke-width="4"/>
    <!-- the plus -->
    <rect x="-7" y="-40" width="14" height="44" rx="4" fill="#f6dc8e"/>
    <rect x="-22" y="-25" width="44" height="14" rx="4" fill="#f6dc8e"/>
    <path d="M-44 -50 A 52 52 0 0 1 10 -70" fill="none" stroke="#fff6d6" stroke-opacity="0.6" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
