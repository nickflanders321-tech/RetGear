name: Check Lua

on:
  push:
  pull_request:

jobs:
  luacheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Lua 5.1 from Ubuntu's packages (building it from lua.org timed out and failed the check on 2026-11-08)
      - name: Install Lua 5.1
        run: |
          sudo apt-get install -y -qq lua5.1 >/dev/null
          sudo ln -sf "$(command -v lua5.1)" /usr/local/bin/lua
      - name: Syntax check every Lua file
        run: |
          for f in *.lua Classes/*.lua Races/*.lua Routes/*.lua Professions/*.lua; do
            lua -e "local f = assert(io.open('$f')):read('*a'); assert(loadstring(f, '$f'))" && echo "ok  $f"
          done
      - name: Every file in the TOCs exists
        run: |
          for t in *.toc; do
            grep -v '^#' "$t" | tr -d '\r' | sed 's#\\#/#g' | while read -r f; do
              [ -z "$f" ] || [ -f "$f" ] || { echo "missing $f (listed in $t)"; exit 1; }
            done
          done
      - name: Every Horde race and class gets a complete route (tools/audit)
        run: lua tools/audit/audit.lua --markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Every card has its art (tools/arcade)
        run: |
          lua tools/arcade/audit_art.lua
          pip install pillow
          python3 tools/arcade/audit_places_img.py
      - name: Route coverage by zone (tools/audit)
        run: python3 tools/audit/coverage.py --markdown >> "$GITHUB_STEP_SUMMARY"
