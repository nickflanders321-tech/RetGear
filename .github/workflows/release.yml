name: Release

# Ships a version whenever the number in VERSION changes on main (or when run
# by hand): tags the commit, builds RetGear-vX.Y.Z.zip and publishes it as a
# GitHub release.
on:
  push:
    branches: [main]
    paths: ['VERSION']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag this version
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="v$(tr -d '[:space:]' < VERSION)"
          echo "v=$v" >> "$GITHUB_OUTPUT"
          if gh release view "$v" >/dev/null 2>&1; then
            echo "Release $v already exists, nothing to do."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! git rev-parse "$v" >/dev/null 2>&1; then
            git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
            git tag -a "$v" -m "RetGear $v"
            git push origin "$v"
          fi
          git checkout -q "$v"
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: Build the zip
        if: steps.tag.outputs.skip == 'false'
        run: |
          v="${{ steps.tag.outputs.v }}"
          mkdir -p .release/RetGear
          cp *.toc *.lua README.md .release/RetGear/
          sed -i "s/@project-version@/$v/g" .release/RetGear/*.toc
          (cd .release && zip -qr "RetGear-$v.zip" RetGear)
          awk -v h="## $v" '$0==h{f=1;next} /^## /{f=0} f' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "RetGear $v" > release-notes.md
          ls -la .release
      - name: Publish the GitHub release
        if: steps.tag.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.v }}
          name: RetGear ${{ steps.tag.outputs.v }}
          body_path: release-notes.md
          files: .release/RetGear-*.zip
          fail_on_unmatched_files: true
