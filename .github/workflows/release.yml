name: Release

# Ships a version whenever the number in VERSION changes on main (or when run
# by hand). It tags the commit, then the packager builds the zip, attaches it
# to a GitHub release, and uploads it to CurseForge once the CF_API_KEY secret
# and the project ID in the .toc are set.
on:
  push:
    branches: [main]
    paths: ['VERSION']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag this version
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="v$(tr -d '[:space:]' < VERSION)"
          echo "v=$v" >> "$GITHUB_OUTPUT"
          if gh release view "$v" >/dev/null 2>&1; then
            echo "Release $v already exists, nothing to do."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! git rev-parse "$v" >/dev/null 2>&1; then
            git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
            git tag -a "$v" -m "RetGear $v"
            git push origin "$v"
          fi
          git checkout -q "$v"
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: Build the zip (and upload to CurseForge when set up)
        if: steps.tag.outputs.skip == 'false'
        uses: BigWigsMods/packager@v2
        with:
          args: -o
      - name: Publish the GitHub release
        if: steps.tag.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ steps.tag.outputs.v }}"
          ls -la .release
          notes=$(awk -v h="## $v" '$0==h{f=1;next} /^## /{f=0} f' CHANGELOG.md)
          [ -z "$notes" ] && notes="RetGear $v"
          gh release view "$v" >/dev/null 2>&1 || gh release create "$v" .release/RetGear*.zip --title "RetGear $v" --notes "$notes"
