name: Release

# Publish a GitHub release (or push a tag) like v0.6.1 to ship a version. The packager builds the zip, uploads it
# to CurseForge (when the CF_API_KEY secret and the project ID in the .toc
# are set) and attaches it to a GitHub release.
on:
  push:
    tags: ['v*']
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
