name: Release

# Ships a version whenever the number in VERSION changes on main (or when run
# by hand): tags the commit, builds Waypath-vX.Y.Z.zip and publishes it as a
# GitHub release.
on:
  push:
    branches: [main]
    paths: ['VERSION']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag this version
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="v$(tr -d '[:space:]' < VERSION)"
          echo "v=$v" >> "$GITHUB_OUTPUT"
          if gh release view "$v" >/dev/null 2>&1; then
            echo "Release $v already exists, nothing to do."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! git rev-parse "$v" >/dev/null 2>&1; then
            git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
            git tag -a "$v" -m "Waypath+ $v"
            git push origin "$v"
          fi
          git checkout -q "$v"
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: Build the zip
        if: steps.tag.outputs.skip == 'false'
        run: |
          v="${{ steps.tag.outputs.v }}"
          mkdir -p .release/Waypath
          cp *.toc *.lua *.xml README.md .release/Waypath/
          for d in Classes Races Routes Professions; do cp -r "$d" .release/Waypath/; done
          sed -i "s/@project-version@/$v/g" .release/Waypath/*.toc
          awk -v h="## $v" '$0==h || index($0, h" ")==1 {f=1;next} /^## /{f=0} f' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "Waypath+ $v" > release-notes.md
          # in-game "what's new" (News.lua) from the same notes
          python3 - "$v" release-notes.md .release/Waypath/News.lua <<'PY'
          import re, sys
          v, src, out = sys.argv[1:4]
          lines = []
          for raw in open(src, encoding="utf-8"):
              m = re.match(r"^(\s*)- (.*)", raw.rstrip())
              if not m: continue
              t = re.sub(r"\*+|`", "", m.group(2)).replace("\\", "\\\\").replace('"', '\\"')
              lines.append(("  " if m.group(1) else "") + t)
          with open(out, "w", encoding="utf-8") as f:
              f.write("-- GENERATED by the release build from CHANGELOG.md\nlocal _, RG = ...\n")
              f.write('RG.NEWS = { version = "%s", lines = {\n' % v)
              for l in lines: f.write('  "%s",\n' % l)
              f.write("} }\n")
          PY
          cat .release/Waypath/News.lua | head -5
          (cd .release && zip -qr "Waypath-$v.zip" Waypath)
          ls -la .release
      - name: Publish the GitHub release
        if: steps.tag.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.v }}
          name: Waypath+ ${{ steps.tag.outputs.v }}
          body_path: release-notes.md
          files: .release/Waypath-*.zip
          fail_on_unmatched_files: true
