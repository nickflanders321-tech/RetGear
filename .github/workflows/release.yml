name: Release

# Ships a version whenever the number in VERSION changes on main (or when run
# by hand): tags the commit, builds Waypath-vX.Y.Z.zip and publishes it as a
# GitHub release.
on:
  push:
    branches: [main]
    paths: ['VERSION']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # CurseForge upload: set the CF_API_KEY secret (Settings > Secrets and variables >
      # Actions). The project ID comes from X-Curse-Project-ID in Waypath.toc (or a
      # CF_PROJECT_ID variable). CF_RELEASE_TYPE (alpha, beta or release; release by
      # default since the WoW Forever launch) and CF_GAME_VERSION (1.60.1 by default;
      # the newest WoW Forever version CurseForge lists is always added too, so a new
      # game patch never makes the upload fail or hides the file) are optional variables.
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
      CF_RELEASE_TYPE: ${{ vars.CF_RELEASE_TYPE || 'release' }}
      CF_GAME_VERSION: ${{ vars.CF_GAME_VERSION || '1.60.1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag this version
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="v$(tr -d '[:space:]' < VERSION)"
          echo "v=$v" >> "$GITHUB_OUTPUT"
          if gh release view "$v" >/dev/null 2>&1; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              # run by hand: rebuild this version and (re)upload it to CurseForge only
              echo "Release $v exists: rebuilding it for CurseForge only."
              echo "exists=true" >> "$GITHUB_OUTPUT"; echo "skip=false" >> "$GITHUB_OUTPUT"
              git checkout -q "$v"; exit 0
            fi
            echo "Release $v already exists, nothing to do."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! git rev-parse "$v" >/dev/null 2>&1; then
            git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
            git tag -a "$v" -m "Waypath+ $v"
            git push origin "$v"
          fi
          git checkout -q "$v"
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: Build the zip
        if: steps.tag.outputs.skip == 'false'
        run: |
          v="${{ steps.tag.outputs.v }}"
          mkdir -p .release/Waypath
          cp *.toc *.lua *.xml README.md LICENSE .release/Waypath/
          for d in Classes Races Routes Professions Media; do cp -r "$d" .release/Waypath/; done
          sed -i "s/@project-version@/$v/g" .release/Waypath/*.toc
          awk -v h="## $v" '$0==h || index($0, h" ")==1 {f=1;next} /^## /{f=0} f' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "Waypath+ $v" > release-notes.md
          # in-game "what's new" (News.lua): the last few versions from CHANGELOG.md
          python3 - "$v" CHANGELOG.md .release/Waypath/News.lua <<'PY'
          import re, sys
          v, src, out = sys.argv[1:4]
          sections, cur = [], None
          for raw in open(src, encoding="utf-8"):
              h = re.match(r"^## (v[\d.]+)", raw)
              if h:
                  if len(sections) >= 6: break
                  cur = {"v": h.group(1), "lines": []}; sections.append(cur); continue
              m = re.match(r"^(\s*)- (.*)", raw.rstrip())
              if cur is None or not m: continue
              t = re.sub(r"\*+|`", "", m.group(2)).replace("\\", "\\\\").replace('"', '\\"')
              cur["lines"].append(("  " if m.group(1) else "") + t)
          with open(out, "w", encoding="utf-8") as f:
              f.write("-- GENERATED by the release build from CHANGELOG.md\nlocal _, RG = ...\n")
              f.write('RG.NEWS = { version = "%s", sections = {\n' % v)
              for sec in sections:
                  f.write('  { v = "%s", lines = {\n' % sec["v"])
                  for l in sec["lines"]: f.write('    "%s",\n' % l)
                  f.write("  } },\n")
              f.write("} }\n")
          PY
          cat .release/Waypath/News.lua | head -5
          (cd .release && zip -qr "Waypath-$v.zip" Waypath)
          ls -la .release
      - name: Publish the GitHub release
        if: steps.tag.outputs.skip == 'false' && steps.tag.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.v }}
          name: Waypath+ ${{ steps.tag.outputs.v }}
          body_path: release-notes.md
          files: .release/Waypath-*.zip
          fail_on_unmatched_files: true
      - name: Upload to CurseForge
        if: steps.tag.outputs.skip == 'false' && env.CF_API_KEY != ''
        run: |
          v="${{ steps.tag.outputs.v }}"
          [ -n "$CF_PROJECT_ID" ] || CF_PROJECT_ID=$(sed -n 's/^## X-Curse-Project-ID: *\([0-9]*\).*/\1/p' Waypath.toc | head -1)
          [ -n "$CF_PROJECT_ID" ] || { echo "No CurseForge project ID"; exit 1; }
          ids=$(curl -sSf -H "X-Api-Token: $CF_API_KEY" https://wow.curseforge.com/api/game/versions | python3 -c '
          import json, os, re, sys
          want = [w.strip() for w in os.environ["CF_GAME_VERSION"].split(",")]
          versions = json.load(sys.stdin)
          ids = {g["id"] for g in versions if g.get("name") in want}
          # plus the newest WoW Forever version (1.60 and up), so a launch or patch version is covered
          forever = [g for g in versions if re.match(r"^1\.(6\d|[7-9]\d)\.\d+$", g.get("name") or "")]
          if forever:
              newest = max(forever, key=lambda g: tuple(int(x) for x in g["name"].split(".")))
              ids.add(newest["id"]); print("newest Forever version on CurseForge: " + newest["name"], file=sys.stderr)
          print(json.dumps(sorted(ids)))')
          echo "CurseForge game versions for $CF_GAME_VERSION: $ids"
          [ "$ids" != "[]" ] || { echo "No CurseForge game version named $CF_GAME_VERSION"; exit 1; }
          meta=$(python3 -c '
          import json, sys
          print(json.dumps({"changelog": open("release-notes.md", encoding="utf-8").read(), "changelogType": "markdown",
            "displayName": "Waypath+ " + sys.argv[1], "gameVersions": json.loads(sys.argv[2]), "releaseType": sys.argv[3]}))' "$v" "$ids" "$CF_RELEASE_TYPE")
          # --form-string: the metadata is sent as is (with -F, a ";" in the changelog cut it short: HTTP 400)
          curl -sS --fail-with-body -H "X-Api-Token: $CF_API_KEY" --form-string "metadata=$meta" -F "file=@.release/Waypath-$v.zip" \
            "https://wow.curseforge.com/api/projects/$CF_PROJECT_ID/upload-file"
